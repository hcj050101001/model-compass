services:
  web:
    build: .
    container_name: llm-frontier-web
    restart: unless-stopped
    ports:
      - "3100:3100"
    env_file:
      - .env
    volumes:
      - ./data:/app/data

  sync-worker:
    build: .
    container_name: llm-frontier-sync
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - ./data:/app/data
    command: >
      sh -c 'while true; do
        npx tsx scripts/sync-data.ts || true;
        sleep $${DATA_SYNC_INTERVAL_SECONDS:-3600};
      done'
    depends_on:
      - web
